<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>404 — Page Not Found | TermSight</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0A0A0A;
        color: #FFFFFF;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .container {
        max-width: 580px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background-color: rgba(255, 255, 255, 0.03);
        padding: 52px 36px;
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #FF3B3B;
        background: rgba(255, 59, 59, 0.12);
        border: 1px solid rgba(255, 59, 59, 0.35);
        padding: 5px 12px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 72px;
        font-weight: 900;
        margin: 0 0 12px 0;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      h1 span {
        color: #FF3B3B;
      }
      p {
        color: #A1A1AA;
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 36px 0;
      }
      .btn {
        display: inline-block;
        background-color: #FFFFFF;
        color: #000000;
        font-weight: 900;
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 0.08em;
        padding: 14px 28px;
        text-decoration: none;
        border: 2px solid #FFFFFF;
        transition: all 0.15s ease;
      }
      .btn:hover {
        background-color: #000000;
        color: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Error 404 · Uncharted Clause</div>
      <h1>404<span>.</span></h1>
      <p>This clause could not be found or has moved. The fine print doesn't mention this page.</p>
      <a href="/" class="btn">Return to TermSight</a>
    </div>
  </body>
</html>
