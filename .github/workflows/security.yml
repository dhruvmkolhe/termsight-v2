name: TermSight Security & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    name: Security Scan & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 🛡️ Pre-Commit Secret Scanner
        run: npm run check:secrets

      - name: 🔍 ESLint Static Code Analysis
        run: npm run lint

      - name: 🧪 Vitest Test Suite (Unit & Security Tests)
        run: npm test

      - name: 📦 Production Build & TypeScript Verification
        run: npm run build
