<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TermSight Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0A0A0A;
      color: #FFFFFF;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .brand span { color: #FF3B3B; }
    .badge {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(0, 200, 83, 0.15);
      color: #00C853;
      padding: 2px 6px;
      border: 1px solid rgba(0, 200, 83, 0.4);
      border-radius: 4px;
    }
    .info {
      font-size: 12px;
      line-height: 1.5;
      color: #A1A1AA;
      margin-bottom: 16px;
    }
    .page-title {
      font-size: 11px;
      font-family: monospace;
      color: #38BDF8;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button.btn-scan {
      width: 100%;
      padding: 12px;
      background: #FFFFFF;
      color: #000000;
      border: 2px solid #FFFFFF;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }
    button.btn-scan:hover {
      background: #000000;
      color: #FFFFFF;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #71717A;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">TermSight<span>.</span></div>
    <div class="badge">AI TOS Scan</div>
  </div>
  <div id="pageTitle" class="page-title">Detecting page...</div>
  <button id="btnScan" class="btn-scan">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>
    Audit This Page
  </button>
  <div class="footer">No data retained · Instant plain-English clarity</div>

  <script src="popup.js"></script>
</body>
</html>
